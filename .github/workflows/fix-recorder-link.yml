# One-time change: add a "Recorded documents" button to the house drawer.
# It opens the Cuyahoga County Recorder's document search filtered to that parcel number only,
# so you land on the deeds, mortgages and liens recorded against the house.
#
# What this workflow does when you commit it:
#   1. Patches site/app.js (skips edits already made).
#   2. Checks the file still parses as JavaScript.
#   3. Commits and redeploys the site.
# If anything fails, nothing is committed. Delete this file once it succeeds.

name: One-time change - recorded documents button

on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-recorder-link.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.js
        run: |
          python3 - <<'EOF'
          import sys

          path = "site/app.js"
          s = open(path, encoding="utf-8").read()

          edits = [
              ("link function", "function recorderUrl(",
               "async function openParcel(pin, row, pan) {",
               '''/* The county Recorder's document search, filtered to this parcel only (deeds, mortgages, liens). */
          function recorderUrl(pin) {
            return `https://cuyahoga.oh.publicsearch.us/results?department=RP&parcel=${encodeURIComponent(fmtPin(String(pin)))}&searchType=advancedSearch`;
          }
          async function openParcel(pin, row, pan) {'''),
              ("drawer button", "Recorded documents</a>",
               "Open in MyPlace</a></div>",
               '''Open in MyPlace</a>
                <a class="btn" href="${esc(recorderUrl(pin))}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Recorded documents</a></div>'''),
          ]
          for label, marker, old, new in edits:
              if marker in s:
                  print(f"{label}: already done")
                  continue
              n = s.count(old)
              if n != 1:
                  sys.exit(f"{label}: couldn't find the text to change ({n} matches):\n  {old}\n"
                           "app.js has changed since this fix was written. Nothing was committed.")
              s = s.replace(old, new)
              print(f"{label}: done")
          open(path, "w", encoding="utf-8").write(s)
          EOF

      - name: Check the JavaScript still parses
        run: node --check site/app.js

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: deedwatch-bot
          GIT_COMMITTER_NAME: deedwatch-bot
          EMAIL: deedwatch-bot
        run: |
          git add site/app.js
          if git diff --cached --quiet; then
            echo "Already patched, nothing to commit."
          else
            git commit -m "Add a Recorded documents button (county Recorder search by parcel)"
            git push
          fi
          gh workflow run update.yml -f mode=build
