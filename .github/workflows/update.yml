name: Update data and site

on:
  schedule:
    - cron: "17 8 * * *"     # nightly, ~3:17 AM Eastern: owner sweep + new sale details
    - cron: "41 */3 * * *"   # every 3 hours: keep backfilling sale history until done
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly | backfill | build"
        default: nightly
  push:
    branches: [main]
    paths: ["site/**", "scraper/**"]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deedwatch-${{ (github.event_name == 'push' || inputs.mode == 'build') && 'site' || 'data' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}";
          elif [ "${{ github.event_name }}" = "push" ]; then m="build";
          elif [ "${{ github.event.schedule }}" = "17 8 * * *" ]; then m="nightly";
          else m="backfill"; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "Mode: $m"

      - name: Base parcel layer (weekly, first run, or when new fields are added)
        run: |
          if [ ! -s data/parcels.jsonl ] || ! grep -q '"ma":' data/parcels.jsonl; then python -m scraper base;
          elif [ "${{ steps.mode.outputs.mode }}" = "nightly" ] && [ "$(date -u +%u)" = "7" ]; then python -m scraper base; fi

      - name: Owner sweep (MyPlace)
        if: steps.mode.outputs.mode == 'nightly'
        run: python -m scraper sweep

      - name: Sale histories
        if: steps.mode.outputs.mode != 'build'
        run: |
          if [ ! -s data/parcels.jsonl ]; then python -m scraper base; fi
          python -m scraper history --minutes ${{ steps.mode.outputs.mode == 'nightly' && 120 || 150 }}

      - name: Commit data
        env:
          GIT_AUTHOR_NAME: deedwatch-bot
          GIT_COMMITTER_NAME: deedwatch-bot
          EMAIL: deedwatch-bot
        run: |
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Data update $(TZ=America/New_York date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push && break; sleep 5; done

      - name: Keep backfilling until every parcel has history
        if: steps.mode.outputs.mode != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rem=$(python -c "import json;print(json.load(open('data/state.json')).get('history',{}).get('remaining',0))")
          echo "Parcels still without history: $rem"
          if [ "$rem" -gt 0 ]; then gh workflow run update.yml --ref main -f mode=backfill; fi

      - name: Build site
        run: |
          git pull --rebase origin main || true
          python -m scraper build --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
