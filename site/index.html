<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deedwatch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Deedwatch · University Heights &amp; neighbors</title>
<meta name="description" content="Who owns what around University Heights, Ohio: recent home sales, ownership changes, top owners and sale prices, from Cuyahoga County records.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f4a'/%3E%3Cpath d='M7 16 16 8l9 8v9h-6v-6h-6v6H7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="btn install" id="installBtn" hidden>Install app</button>
  <div class="brand"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f5f4a"/><path d="M7 16 16 8l9 8v9h-6v-6h-6v6H7z" fill="#fff"/></svg><b>Deedwatch</b></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search a name or address, past or present" autocomplete="off" aria-label="Search names and addresses">
    <div id="results" class="results" hidden></div>
  </div>
  <div class="areas" id="areas" role="tablist" aria-label="Area"></div>
</header>

<main class="layout">
  <section class="mapcol">
    <div id="map"></div>
    <div class="maptools">
      <span class="pill"><svg class="ico" viewBox="0 0 20 20"><path d="M3 10 10 4l7 6v7h-5v-4H8v4H3z"/></svg><span id="mapcount">Sales in the last 60 days</span></span>
      <label class="pill toggle"><input type="checkbox" id="nonmarket"> Include $0 &amp; non-market transfers</label>
    </div>
  </section>

  <aside class="side">
    <section class="card" id="weekCard">
      <div class="card-h"><h2>This week</h2><span class="sub" id="weekSub"></span></div>
      <ul class="feed" id="week"></ul>
    </section>

    <section class="card" id="pricesCard" hidden>
      <div class="card-h"><h2>Sale prices</h2>
        <div class="seg" id="priceKind"><button data-k="res" class="on">Homes</button><button data-k="all">All</button></div>
      </div>
      <div class="tiles" id="priceTiles"></div>
      <div class="chart" id="priceChart"></div>
      <p class="fine">Market sales only: $0, quit-claim, sheriff and multi-parcel transfers are excluded.</p>
    </section>

    <section class="card" id="ownersCard">
      <button class="card-h collapse" id="ownersToggle" aria-expanded="false" aria-controls="ownersBody"><h2>Top owners</h2><span class="sub" id="ownersSub"></span><span class="chev" aria-hidden="true"></span></button>
      <div id="ownersBody" hidden>
        <div class="owner-tools">
          <div class="seg" id="ownerMode"><button data-k="name" class="on">By name</button><button data-k="mail">By mailing address</button></div>
          <label class="mini"><input type="checkbox" id="hidePublic" checked> Hide public owners</label>
        </div>
        <div id="owners" class="owners"></div>
      </div>
    </section>

    <footer class="foot" id="foot"></footer>
  </aside>
</main>

<div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-h"><div><h3 id="dTitle"></h3><div class="sub" id="dSub"></div></div><button class="x" id="dClose" aria-label="Close">×</button></div>
  <div class="drawer-b" id="dBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-rotate@0.6.2/dist/leaflet-rotate.js" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
